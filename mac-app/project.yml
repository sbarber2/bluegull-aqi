name: BluegullAQI
options:
  bundleIdPrefix: solutions.bluegull
  deploymentTarget:
    macOS: "14.0"

packages:
  BluegullAQIKit:
    path: BluegullAQIKit

targets:
  BluegullAQI:
    type: application
    platform: macOS
    sources:
      - path: BluegullAQI
        # Or the plist below lands in Contents/Resources as well, via the
        # copy phase AND as an ordinary resource -- two copies, one of them
        # in a place SMAppService will never look.
        excludes:
          - "LaunchAgents/**"
      # bluegull-aqi-hib.3: SMAppService.agent(plistName:) resolves its
      # plist from the app's own Contents/Library/LaunchAgents and nowhere
      # else (SMAppService.h) -- this copy phase is load-bearing, not
      # packaging taste.
      - path: BluegullAQI/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: BluegullAQIKit
        product: BluegullAQIKit
      - target: BluegullAQIWidget
        embed: true
      # bluegull-aqi-hib.2. Lands at Contents/Library/LoginItems/
      # BluegullAQIHelper.app, which is what the LaunchAgent plist's
      # BundleProgram key names -- change one and you must change the other.
      # LoginItems is the conventional home for a nested helper app and
      # codesign seals it as nested code.
      #
      # codeSignOnCopy so the helper keeps its OWN code-signing identity: a
      # separate identity is the entire reason a helper can hold a location
      # grant the app's own bundle cannot lend it, so getting this wrong
      # would quietly defeat the point of the whole epic.
      - target: BluegullAQIHelper
        embed: true
        codeSignOnCopy: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.bluegull.aqi
        CODE_SIGN_STYLE: Automatic
        # Steve's Apple Developer team -- the one that registered
        # solutions.bluegull.aqi's bundle IDs/App Group (bluegull-aqi-
        # 8ef.5). Belongs in project.yml, not just Xcode's local UI: this
        # is the actual source `xcodegen generate` reads, so leaving it out
        # here meant every regeneration (every `make app-build`/`test-swift`
        # run) silently wiped whatever team Xcode had picked, forcing a
        # re-select each time. Not a secret -- a public team identifier.
        DEVELOPMENT_TEAM: G5DWPBWHQ5
        ENABLE_HARDENED_RUNTIME: true
        # bluegull-aqi-fw4.9: not 1.0 -- that got used up on three
        # indistinguishable ad-hoc builds already handed to a tester before
        # anyone was tracking build numbers. Bump by hand at real
        # milestones; CURRENT_PROJECT_VERSION below is the number that
        # actually disambiguates one build from another, and it's set from
        # the command line (git commit count), not here -- see the Makefile
        # (app-build/app-package) for the override. This "1" is just the
        # fallback for a raw Xcode build that bypasses the Makefile.
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        # bluegull-aqi-fw4.9: default so a raw Xcode build (bypassing the
        # Makefile's git-derived override) shows something legible instead
        # of a literal unexpanded "$(GIT_COMMIT_SHA)" in Settings.
        GIT_COMMIT_SHA: unknown
        # BluegullAQI/Assets.xcassets/AppIcon.appiconset (bluegull-aqi-b3r)
        # -- the 10-image .iconset Xcode/the OS needs, generated from
        # mac-app/branding/AppIcon-1024.png. Regenerate both if the source
        # master changes (see that file's own provenance note).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BluegullAQI/Info.plist
      properties:
        # bluegull-aqi-fw4.9: xcodegen only bakes CFBundleShortVersionString/
        # CFBundleVersion from MARKETING_VERSION/CURRENT_PROJECT_VERSION as
        # LITERAL strings the first time it creates this file -- on every
        # later `generate`, an already-present Info.plist key that isn't
        # listed here gets left alone, so those two kept reading a stale
        # "1.0"/"1" no matter what the build settings said (confirmed: three
        # ad-hoc DMGs shipped to a tester all reading "1.0"). Spelling them
        # out explicitly as `$(...)` placeholders, same trick as
        # GitCommitSHA below, makes Xcode's own build-time Info.plist
        # expansion (-expandbuildsettings) resolve them fresh on every
        # build instead.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar-only app: no Dock icon, no main window (bluegull-aqi-e70.1).
        LSUIElement: true
        # Silences "No App Category is set" at archive time and gives the
        # app a real category if it's ever browsed outside the Store
        # (Finder Get Info, notarization metadata). Air quality is closest
        # to Apple's fixed category list under Weather.
        LSApplicationCategoryType: public.app-category.weather
        # Friendly display name -- kept separate from PRODUCT_NAME (which stays
        # "BluegullAQI", no space) so the test target's auto-derived TEST_HOST
        # path still matches the actual built binary.
        CFBundleDisplayName: BlueGull AQI
        # NO NSLocationWhenInUseUsageDescription here either -- the string
        # the user reads now lives in the HELPER's Info.plist, because the
        # helper is the process that asks (bluegull-aqi-hib.6). A usage
        # description on a bundle that never requests authorization is dead
        # weight that makes it look like the app still might.
        # Widget tap-to-expand deep link (bluegull-aqi-mtm.14) -- matches
        # WidgetDeepLink.scheme/.host in BluegullAQIKit.
        CFBundleURLTypes:
          - CFBundleURLName: solutions.bluegull.aqi
            CFBundleURLSchemes:
              - bluegullaqi
        # bluegull-aqi-fw4.9: traces a distributed build back to an exact
        # commit -- shown in Settings alongside the marketing/build
        # version. `$(GIT_COMMIT_SHA)` is expanded from the build setting
        # above by Xcode's own Info.plist processing (already running with
        # -expandbuildsettings), not injected by a separate script phase.
        GitCommitSHA: $(GIT_COMMIT_SHA)
    entitlements:
      path: BluegullAQI/BluegullAQI.entitlements
      properties:
        # Required for Mac App Store distribution.
        com.apple.security.app-sandbox: true
        # Outbound requests to AirNow (Direct mode) and the BlueGull backend (Service mode).
        com.apple.security.network.client: true
        # NO com.apple.security.personal-information.location, deliberately
        # (bluegull-aqi-hib.6, Steve's Option 1 decision). The helper agent
        # is the sole location owner; the app reads the shared cache the
        # helper writes, exactly as the widget already does. Removing the
        # entitlement rather than merely not using it is what makes "exactly
        # one location prompt across a clean install" structurally true --
        # with it present, any future call site could quietly re-introduce
        # the second prompt and nothing would fail.
        #
        # CLGeocoder is unaffected and still works: address lookup and
        # reverse geocoding need network access, not location authorization
        # (see LocationResolver's own doc comment). Pinned locations
        # therefore keep working with no location grant present at all.
        #
        # Shared cache with the widget extension (bluegull-aqi-8ef.5).
        com.apple.security.application-groups:
          - group.solutions.bluegull.aqi
        # Shares the user's AirNow key with the widget extension, which
        # needs it for its own Direct-mode fetches (bluegull-aqi-mtm.25).
        # Must stay in sync with KeychainAccessGroup.shared.
        keychain-access-groups:
          - $(AppIdentifierPrefix)solutions.bluegull.aqi

  BluegullAQIWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: BluegullAQIWidget
      # Shared with the BluegullAQI target (bluegull-aqi-4j6) -- the
      # .appex runs as its own process (visible in Activity Monitor), and
      # Activity Monitor resolves a process's icon from its own bundle,
      # not the container app's, for extension processes. Pointing both
      # targets at the same directory compiles one shared source into
      # each target's own Assets.car, rather than duplicating the PNGs.
      - path: BluegullAQI/Assets.xcassets
    dependencies:
      - package: BluegullAQIKit
        product: BluegullAQIKit
      - package: BluegullAQIKit
        product: BluegullAQIWidgetViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.bluegull.aqi.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5DWPBWHQ5
        ENABLE_HARDENED_RUNTIME: true
        # bluegull-aqi-fw4.9: kept in lockstep with the container app's own
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION -- see that target's own
        # comment.
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BluegullAQIWidget/Info.plist
      properties:
        # bluegull-aqi-fw4.9: same reasoning as the container app's own.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BluegullAQIWidget/BluegullAQIWidget.entitlements
      properties:
        # Required for Mac App Store distribution.
        com.apple.security.app-sandbox: true
        # bluegull-aqi-mtm.23/mtm.24: the widget extension fetches for
        # itself on an exact cache miss, instead of waiting for the
        # container app to notice and fetch on its behalf. The previous
        # comment here cited "restricted background networking" as the
        # reason to withhold this -- that conflates WidgetKit's background
        # *refresh budget* (real: how often a provider is invoked
        # unprompted) with network access *while the provider runs* (not
        # restricted). A configuration change is a user-initiated trigger,
        # and the widget process demonstrably receives its configured
        # location promptly (bluegull-aqi-o4b logs) -- it just had no way
        # to act on it, which is the whole 3-5 minute delay in mtm.22.
        #
        # Still NO location entitlement: "Current Location" widgets keep
        # reading the container app's resolved GPS from the App Group.
        com.apple.security.network.client: true
        # Shared cache -- now written by both processes, not just the
        # container app.
        com.apple.security.application-groups:
          - group.solutions.bluegull.aqi
        # Reads the user's AirNow key for Direct-mode fetches
        # (bluegull-aqi-mtm.25). NOTE: AirNowDirectClient sends this key as
        # a URL query parameter -- never log a request URL from this
        # process (CLAUDE.md secrets rule; ComplianceTests guards it).
        keychain-access-groups:
          - $(AppIdentifierPrefix)solutions.bluegull.aqi

  # bluegull-aqi-hib.2/hib.4. The location helper agent: a separate bundle,
  # therefore a separate TCC identity, therefore able to hold its own
  # location grant -- which is the one thing a widget extension structurally
  # cannot do (proven across three spike rounds; Apple's own Weather widget
  # gets there only via the private com.apple.locationd.effective_bundle).
  #
  # An `application`, not a `tool`, even though nothing about it is an app in
  # the usual sense: CoreLocation needs a real Info.plist carrying
  # NSLocationWhenInUseUsageDescription, and the spike measured exactly this
  # shape (an LSUIElement .app, started headlessly by launchd) getting a
  # prompt, a grant and a fix. LSUIElement keeps it out of the Dock and the
  # app switcher.
  BluegullAQIHelper:
    type: application
    platform: macOS
    sources:
      - path: BluegullAQIHelper
    dependencies:
      - package: BluegullAQIKit
        product: BluegullAQIKit
    settings:
      base:
        # NOT solutions.bluegull.aqi.helper (bluegull-aqi-hib.2): the
        # 2026-08-12 spike left a real, unremovable locationd grant for that
        # identifier -- tccutil has no authority over locationd Location
        # grants and fails -10814 -- so reusing it would silently inherit a
        # grant and make any first-run test invalid. Keep in sync with
        # LocationHelperIdentity.bundleIdentifier.
        PRODUCT_BUNDLE_IDENTIFIER: solutions.bluegull.aqi.locationhelper
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5DWPBWHQ5
        ENABLE_HARDENED_RUNTIME: true
        # bluegull-aqi-fw4.9: kept in lockstep with the container app's own,
        # same reasoning as the widget extension's.
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: BluegullAQIHelper/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No Dock icon, no windows -- see the target comment above.
        LSUIElement: true
        # bluegull-aqi-hib.6 item 2: the location prompt quotes the HELPER's
        # display name, not the app's. The spike's said "BlueGull AQI
        # Location Probe", which is not a thing a user has heard of. This has
        # to read as the app they installed, and it is also the name that
        # appears in System Settings > Login Items & Extensions.
        CFBundleDisplayName: BlueGull AQI
        # Must match the app's own string (see the BluegullAQI target) --
        # under bluegull-aqi-hib.6 this is the ONLY one the user ever sees,
        # because the app stops asking for location entirely.
        NSLocationWhenInUseUsageDescription: >-
          BlueGull AQI uses your location to show the air quality for where you are.
    entitlements:
      path: BluegullAQIHelper/BluegullAQIHelper.entitlements
      properties:
        # Spelled out here rather than hand-written at the path above:
        # xcodegen GENERATES that file from these properties and silently
        # overwrites whatever was there. A hand-written entitlements file
        # referenced with only `path:` gets replaced by an empty <dict/> on
        # the next `generate` -- which happened in spike/hib10 and produced a
        # signed-but-unsandboxed agent that looked fine until the signature
        # was inspected.
        com.apple.security.app-sandbox: true
        # The whole point of this target.
        com.apple.security.personal-information.location: true
        # Direct-mode fetches to AirNow, Service-mode to the BlueGull backend.
        com.apple.security.network.client: true
        # Shared cache with the app and the widget -- where this writes the
        # current-location reading (bluegull-aqi-hib.4). ALSO the prefix that
        # makes the mach service reachable from the sandboxed app at all
        # (bluegull-aqi-hib.11): a sandboxed process may look up a global
        # mach name only if it begins with one of its own app-group values.
        com.apple.security.application-groups:
          - group.solutions.bluegull.aqi
        # Reads the user's AirNow key for Direct-mode fetches. NOTE:
        # AirNowDirectClient sends that key as a URL query parameter --
        # never log a request URL from this process (CLAUDE.md secrets rule;
        # ComplianceTests guards it). Must stay in sync with
        # KeychainAccessGroup.shared.
        keychain-access-groups:
          - $(AppIdentifierPrefix)solutions.bluegull.aqi

  BluegullAQITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BluegullAQITests
    dependencies:
      - target: BluegullAQI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic

  BluegullAQIUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BluegullAQIUITests
    dependencies:
      - target: BluegullAQI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: BluegullAQI

schemes:
  BluegullAQI:
    build:
      targets:
        BluegullAQI: all
        BluegullAQIWidget: all
        BluegullAQIHelper: all
        BluegullAQITests: [test]
        BluegullAQIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BluegullAQITests
        - BluegullAQIUITests
