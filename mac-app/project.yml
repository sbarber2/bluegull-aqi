name: BluegullAQI
options:
  bundleIdPrefix: solutions.bluegull
  deploymentTarget:
    macOS: "14.0"

packages:
  BluegullAQIKit:
    path: BluegullAQIKit

targets:
  BluegullAQI:
    type: application
    platform: macOS
    sources:
      - path: BluegullAQI
    dependencies:
      - package: BluegullAQIKit
        product: BluegullAQIKit
      - target: BluegullAQIWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.bluegull.aqi
        CODE_SIGN_STYLE: Automatic
        # Steve's Apple Developer team -- the one that registered
        # solutions.bluegull.aqi's bundle IDs/App Group (bluegull-aqi-
        # 8ef.5). Belongs in project.yml, not just Xcode's local UI: this
        # is the actual source `xcodegen generate` reads, so leaving it out
        # here meant every regeneration (every `make app-build`/`test-swift`
        # run) silently wiped whatever team Xcode had picked, forcing a
        # re-select each time. Not a secret -- a public team identifier.
        DEVELOPMENT_TEAM: G5DWPBWHQ5
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # BluegullAQI/Assets.xcassets/AppIcon.appiconset (bluegull-aqi-b3r)
        # -- the 10-image .iconset Xcode/the OS needs, generated from
        # mac-app/branding/AppIcon-1024.png. Regenerate both if the source
        # master changes (see that file's own provenance note).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BluegullAQI/Info.plist
      properties:
        # Menu bar-only app: no Dock icon, no main window (bluegull-aqi-e70.1).
        LSUIElement: true
        # Silences "No App Category is set" at archive time and gives the
        # app a real category if it's ever browsed outside the Store
        # (Finder Get Info, notarization metadata). Air quality is closest
        # to Apple's fixed category list under Weather.
        LSApplicationCategoryType: public.app-category.weather
        # Friendly display name -- kept separate from PRODUCT_NAME (which stays
        # "BluegullAQI", no space) so the test target's auto-derived TEST_HOST
        # path still matches the actual built binary.
        CFBundleDisplayName: BlueGull AQI
        NSLocationWhenInUseUsageDescription: >-
          BlueGull AQI uses your location to show the air quality for where you are.
        # Widget tap-to-expand deep link (bluegull-aqi-mtm.14) -- matches
        # WidgetDeepLink.scheme/.host in BluegullAQIKit.
        CFBundleURLTypes:
          - CFBundleURLName: solutions.bluegull.aqi
            CFBundleURLSchemes:
              - bluegullaqi
    entitlements:
      path: BluegullAQI/BluegullAQI.entitlements
      properties:
        # Required for Mac App Store distribution.
        com.apple.security.app-sandbox: true
        # Outbound requests to AirNow (Direct mode) and the BlueGull backend (Service mode).
        com.apple.security.network.client: true
        # CoreLocation (current-location mode).
        com.apple.security.personal-information.location: true
        # Shared cache with the widget extension (bluegull-aqi-8ef.5).
        com.apple.security.application-groups:
          - group.solutions.bluegull.aqi
        # Shares the user's AirNow key with the widget extension, which
        # needs it for its own Direct-mode fetches (bluegull-aqi-mtm.25).
        # Must stay in sync with KeychainAccessGroup.shared.
        keychain-access-groups:
          - $(AppIdentifierPrefix)solutions.bluegull.aqi

  BluegullAQIWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: BluegullAQIWidget
    dependencies:
      - package: BluegullAQIKit
        product: BluegullAQIKit
      - package: BluegullAQIKit
        product: BluegullAQIWidgetViews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.bluegull.aqi.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G5DWPBWHQ5
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: BluegullAQIWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BluegullAQIWidget/BluegullAQIWidget.entitlements
      properties:
        # Required for Mac App Store distribution.
        com.apple.security.app-sandbox: true
        # bluegull-aqi-mtm.23/mtm.24: the widget extension fetches for
        # itself on an exact cache miss, instead of waiting for the
        # container app to notice and fetch on its behalf. The previous
        # comment here cited "restricted background networking" as the
        # reason to withhold this -- that conflates WidgetKit's background
        # *refresh budget* (real: how often a provider is invoked
        # unprompted) with network access *while the provider runs* (not
        # restricted). A configuration change is a user-initiated trigger,
        # and the widget process demonstrably receives its configured
        # location promptly (bluegull-aqi-o4b logs) -- it just had no way
        # to act on it, which is the whole 3-5 minute delay in mtm.22.
        #
        # Still NO location entitlement: "Current Location" widgets keep
        # reading the container app's resolved GPS from the App Group.
        com.apple.security.network.client: true
        # Shared cache -- now written by both processes, not just the
        # container app.
        com.apple.security.application-groups:
          - group.solutions.bluegull.aqi
        # Reads the user's AirNow key for Direct-mode fetches
        # (bluegull-aqi-mtm.25). NOTE: AirNowDirectClient sends this key as
        # a URL query parameter -- never log a request URL from this
        # process (CLAUDE.md secrets rule; ComplianceTests guards it).
        keychain-access-groups:
          - $(AppIdentifierPrefix)solutions.bluegull.aqi

  BluegullAQITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BluegullAQITests
    dependencies:
      - target: BluegullAQI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic

  BluegullAQIUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BluegullAQIUITests
    dependencies:
      - target: BluegullAQI
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: BluegullAQI

schemes:
  BluegullAQI:
    build:
      targets:
        BluegullAQI: all
        BluegullAQIWidget: all
        BluegullAQITests: [test]
        BluegullAQIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BluegullAQITests
        - BluegullAQIUITests
