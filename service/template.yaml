# -----------------------------------------------------------------------------
# BlueGull AQI backend -- a rate-limited caching proxy in front of the AirNow
# API. See /doc/DESIGN.md for the full design.
#
# Covers bluegull-aqi-q9r.2 (handler), q9r.3 (DynamoDB cache table), q9r.4
# (SSM-stored AirNow API key), q9r.31 (Lambda reserved concurrency + API
# Gateway throttling -- the PRIMARY cost circuit breakers), and q9r.6
# (Route53 + ACM custom domain, single domain bluegull.solutions per
# bluegull-aqi-8ef.24 -- see doc/DESIGN.md "Custom domain"). No WAFv2 rate-
# based rule here on purpose: it can't attach to an HTTP API (v2) at all
# (bluegull-aqi-q9r.5, resolved as not viable -- see doc/DESIGN.md "Rate
# limiting").
# -----------------------------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BlueGull AQI backend: a rate-limited caching proxy in front of the AirNow API.

Parameters:
  DomainName:
    Type: String
    Description: >
      Full custom domain name for this stack, e.g. aqi.bluegull.solutions
      (prod), dev.aqi.bluegull.solutions, or stage.aqi.bluegull.solutions.
      No default -- deliberately required via parameter_overrides per
      environment in samconfig.toml, so it's never possible to deploy a
      stack without explicitly choosing which hostname it answers to. See
      doc/DESIGN.md "Custom domain" (bluegull-aqi-q9r.6, bluegull-aqi-8ef.24).

  HostedZoneId:
    Type: String
    Description: >
      Route53 hosted zone ID for aqi.bluegull.solutions (single zone shared
      by all three dot-subdomain stacks). Used for both ACM DNS validation
      and the alias record pointing DomainName at the API Gateway custom
      domain.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]
    Description: Default LOG_LEVEL environment value for the function.

  AirNowApiKeySsmParameter:
    Type: String
    Default: /bluegull-aqi/airnow-api-key
    Description: >
      SSM SecureString parameter name holding the service's own AirNow API key.
      Read at runtime by the Lambda (not a CloudFormation dynamic reference --
      never baked into the deployed template or the function's environment
      variables). See doc/DESIGN.md "Secrets & credentials".

  CacheTtlSeconds:
    Type: Number
    Default: 3600
    Description: >
      Cache entry lifetime, aligned to the next boundary of this size since
      the epoch (e.g. the top of the next UTC hour, at the default) rather
      than a rolling window from each entry's own first-request time --
      matches AirNow's roughly-hourly NowCast publish cadence
      (bluegull-aqi-q9r.15).

  LambdaReservedConcurrentExecutions:
    Type: Number
    Default: 20
    Description: >
      Hard ceiling on concurrent Lambda executions -- the PRIMARY circuit
      breaker against denial-of-wallet (bluegull-aqi-q9r.31). Lambda, API
      Gateway, and on-demand DynamoDB all scale (and bill) elastically, so
      nothing else in this stack bounds cost under a sustained flood; this
      is what makes the ceiling knowable. Deliberately conservative for a
      personal-scale project that shares this AWS account with Plant-Tracer
      -- raise per environment via parameter_overrides, not by editing this
      default.

      0 is a special sentinel meaning "no reservation at all" (see
      HasReservedConcurrency below) -- NOT "reserve zero executions," which
      would instead throttle the function permanently. Exists because this
      brand-new account's default Lambda concurrency quota is still only 10
      (bluegull-aqi-q9r.35), and AWS enforces a hard floor of 10
      *unreserved* executions account-wide -- with a 10-execution account
      total, no positive reservation is possible at all until a quota
      increase lands.
      Temporary, dev-only: the account's own 10-execution ceiling still
      bounds this function regardless (nothing else competes for it in this
      account), so this doesn't meaningfully weaken protection for a
      personal-scale dev deploy, but it is a real reduction from an explicit
      per-function guarantee -- revert once the quota increase lands, see
      bluegull-aqi-q9r.36.

  ApiThrottlingRateLimit:
    Type: Number
    Default: 10
    Description: >
      API Gateway steady-state requests/second cap (bluegull-aqi-q9r.31),
      independent of both WAF (bluegull-aqi-q9r.5, not deployed yet -- and
      which bills per request itself, so it amplifies cost under attack
      rather than capping it) and the Lambda concurrency ceiling above.

  ApiThrottlingBurstLimit:
    Type: Number
    Default: 20
    Description: Token-bucket burst capacity paired with ApiThrottlingRateLimit.

  MissRateLimitWindowSeconds:
    Type: Number
    Default: 3600
    Description: >
      Fixed wall-clock window for the cache-miss budget (bluegull-aqi-q9r.32)
      -- defaults to matching AirNow's own hourly enforcement window, per its
      FAQ ("blocked for the rest of the hour" on violation).

  MissRateLimitBudget:
    Type: Number
    Default: 400
    Description: >
      Max cache-miss-triggered AirNow calls allowed per MissRateLimitWindowSeconds,
      shared across all callers and locations (bluegull-aqi-q9r.32) -- the
      stronger, more targeted defense against the cache-cardinality attack,
      since misses (not overall request volume) are what cost AirNow quota.
      A conservative placeholder: AirNow's real per-key limit isn't published
      and only appears on the account dashboard after registering
      (bluegull-aqi-8ef.1) -- re-tune once that number is known.

Conditions:
  # See LambdaReservedConcurrentExecutions's own Description for why 0 is
  # a sentinel for "skip the reservation," not a real reserved value.
  HasReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrentExecutions, 0]]

Resources:
  AqiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

  # DNS-validated: CloudFormation creates the validation record in
  # HostedZoneId itself and waits for it, so `sam deploy` blocks until the
  # cert is actually issued -- no separate out-of-band ACM step.
  AqiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Regional (not edge-optimized): AWS::Serverless::HttpApi custom domains
  # only support regional certs, so this must be in the same region as the
  # API itself (us-east-2) -- see doc/DESIGN.md "AWS region".
  AqiApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref AqiCertificate
          EndpointType: REGIONAL

  AqiApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref AqiHttpApi
      DomainName: !Ref AqiApiDomainName
      Stage: prod

  AqiApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt AqiApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt AqiApiDomainName.RegionalHostedZoneId
        EvaluateTargetHealth: false

  AqiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LocationKey
          AttributeType: S
      KeySchema:
        - AttributeName: LocationKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  AqiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AqiFunction}"
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  AqiFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AqiCacheTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AqiCacheTable.Arn
        - PolicyName: AirNowApiKeyAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AirNowApiKeySsmParameter}"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  AqiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.14
      BuildProperties:
        RequirementsFile: requirements.txt
    Properties:
      Role: !GetAtt AqiFunctionExecutionRole.Arn
      Runtime: python3.14
      Architectures: [arm64]
      PackageType: Zip
      CodeUri: src/
      Handler: bluegull_aqi_service.lambda_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref LambdaReservedConcurrentExecutions, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CACHE_TABLE_NAME: !Ref AqiCacheTable
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
          AIRNOW_API_KEY_SSM_PARAMETER: !Ref AirNowApiKeySsmParameter
          MISS_RATE_LIMIT_WINDOW_SECONDS: !Ref MissRateLimitWindowSeconds
          MISS_RATE_LIMIT_BUDGET: !Ref MissRateLimitBudget
      Events:
        AqiRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref AqiHttpApi
            Path: /aqi
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Default (execute-api) endpoint for the HTTP API -- the custom domain below is the intended entry point.
    Value: !Sub "https://${AqiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"

  CustomDomainUrl:
    Description: Custom domain endpoint for this stack.
    Value: !Sub "https://${DomainName}/"
