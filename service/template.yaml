# -----------------------------------------------------------------------------
# BlueGull AQI backend -- a rate-limited caching proxy in front of the AirNow
# API. See /doc/DESIGN.md for the full design.
#
# Covers bluegull-aqi-q9r.2 (handler), q9r.3 (DynamoDB cache table), q9r.4
# (SSM-stored AirNow API key), and q9r.31 (Lambda reserved concurrency + API
# Gateway throttling -- the PRIMARY cost circuit breakers). Deliberately NOT
# here yet, each its own tracked task:
#   - WAFv2 per-IP rate-based rule                    (bluegull-aqi-q9r.5)
#   - Route53 + ACM custom domain                     (bluegull-aqi-q9r.6)
#   - Stale-while-revalidate + single-flight cache      (bluegull-aqi-q9r.15)
# -----------------------------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BlueGull AQI backend: a rate-limited caching proxy in front of the AirNow API.

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]
    Description: Default LOG_LEVEL environment value for the function.

  AirNowApiKeySsmParameter:
    Type: String
    Default: /bluegull-aqi/airnow-api-key
    Description: >
      SSM SecureString parameter name holding the service's own AirNow API key.
      Read at runtime by the Lambda (not a CloudFormation dynamic reference --
      never baked into the deployed template or the function's environment
      variables). See doc/DESIGN.md "Secrets & credentials".

  CacheTtlSeconds:
    Type: Number
    Default: 3600
    Description: >
      Cache entry lifetime, aligned to the next boundary of this size since
      the epoch (e.g. the top of the next UTC hour, at the default) rather
      than a rolling window from each entry's own first-request time --
      matches AirNow's roughly-hourly NowCast publish cadence
      (bluegull-aqi-q9r.15).

  LambdaReservedConcurrentExecutions:
    Type: Number
    Default: 20
    Description: >
      Hard ceiling on concurrent Lambda executions -- the PRIMARY circuit
      breaker against denial-of-wallet (bluegull-aqi-q9r.31). Lambda, API
      Gateway, and on-demand DynamoDB all scale (and bill) elastically, so
      nothing else in this stack bounds cost under a sustained flood; this
      is what makes the ceiling knowable. Deliberately conservative for a
      personal-scale project that shares this AWS account with Plant-Tracer
      -- raise per environment via parameter_overrides, not by editing this
      default.

  ApiThrottlingRateLimit:
    Type: Number
    Default: 10
    Description: >
      API Gateway steady-state requests/second cap (bluegull-aqi-q9r.31),
      independent of both WAF (bluegull-aqi-q9r.5, not deployed yet -- and
      which bills per request itself, so it amplifies cost under attack
      rather than capping it) and the Lambda concurrency ceiling above.

  ApiThrottlingBurstLimit:
    Type: Number
    Default: 20
    Description: Token-bucket burst capacity paired with ApiThrottlingRateLimit.

  MissRateLimitWindowSeconds:
    Type: Number
    Default: 3600
    Description: >
      Fixed wall-clock window for the cache-miss budget (bluegull-aqi-q9r.32)
      -- defaults to matching AirNow's own hourly enforcement window, per its
      FAQ ("blocked for the rest of the hour" on violation).

  MissRateLimitBudget:
    Type: Number
    Default: 400
    Description: >
      Max cache-miss-triggered AirNow calls allowed per MissRateLimitWindowSeconds,
      shared across all callers and locations (bluegull-aqi-q9r.32) -- the
      stronger, more targeted defense against the cache-cardinality attack,
      since misses (not overall request volume) are what cost AirNow quota.
      A conservative placeholder: AirNow's real per-key limit isn't published
      and only appears on the account dashboard after registering
      (bluegull-aqi-8ef.1) -- re-tune once that number is known.

Resources:
  AqiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

  AqiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LocationKey
          AttributeType: S
      KeySchema:
        - AttributeName: LocationKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  AqiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AqiFunction}"
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  AqiFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AqiCacheTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt AqiCacheTable.Arn
        - PolicyName: AirNowApiKeyAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AirNowApiKeySsmParameter}"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  AqiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.14
      BuildProperties:
        RequirementsFile: requirements.txt
    Properties:
      Role: !GetAtt AqiFunctionExecutionRole.Arn
      Runtime: python3.14
      Architectures: [arm64]
      PackageType: Zip
      CodeUri: src/
      Handler: bluegull_aqi_service.lambda_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrentExecutions
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CACHE_TABLE_NAME: !Ref AqiCacheTable
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
          AIRNOW_API_KEY_SSM_PARAMETER: !Ref AirNowApiKeySsmParameter
          MISS_RATE_LIMIT_WINDOW_SECONDS: !Ref MissRateLimitWindowSeconds
          MISS_RATE_LIMIT_BUDGET: !Ref MissRateLimitBudget
      Events:
        AqiRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref AqiHttpApi
            Path: /aqi
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Default (execute-api) endpoint for the HTTP API -- superseded by the custom domain once bluegull-aqi-q9r.6 lands.
    Value: !Sub "https://${AqiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
