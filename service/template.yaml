# -----------------------------------------------------------------------------
# BlueGull AQI backend -- a rate-limited caching proxy in front of the AirNow
# API. See /doc/DESIGN.md for the full design.
#
# Covers bluegull-aqi-q9r.2 (handler), q9r.3 (DynamoDB cache table), and q9r.4
# (SSM-stored AirNow API key). Deliberately NOT here yet, each its own tracked
# task:
#   - WAFv2 per-IP rate-based rule                    (bluegull-aqi-q9r.5)
#   - Route53 + ACM custom domain                     (bluegull-aqi-q9r.6)
#   - Reserved concurrency / scale config              (bluegull-aqi-q9r.17)
#   - Stale-while-revalidate + single-flight cache      (bluegull-aqi-q9r.15)
#   - Coordinate validation / coverage-area rejection   (bluegull-aqi-q9r.30)
# -----------------------------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BlueGull AQI backend: a rate-limited caching proxy in front of the AirNow API.

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]
    Description: Default LOG_LEVEL environment value for the function.

  AirNowApiKeySsmParameter:
    Type: String
    Default: /bluegull-aqi/airnow-api-key
    Description: >
      SSM SecureString parameter name holding the service's own AirNow API key.
      Read at runtime by the Lambda (not a CloudFormation dynamic reference --
      never baked into the deployed template or the function's environment
      variables). See doc/DESIGN.md "Secrets & credentials".

  CacheTtlSeconds:
    Type: Number
    Default: 3600
    Description: >
      Cache entry lifetime. ~1 hour to match AirNow's own NowCast publish
      cadence -- see bluegull-aqi-q9r.15 for the stale-while-revalidate
      refinement that will sit on top of this basic TTL.

Resources:
  AqiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  AqiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LocationKey
          AttributeType: S
      KeySchema:
        - AttributeName: LocationKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  AqiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AqiFunction}"
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  AqiFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AqiCacheTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt AqiCacheTable.Arn
        - PolicyName: AirNowApiKeyAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AirNowApiKeySsmParameter}"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  AqiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.14
      BuildProperties:
        RequirementsFile: requirements.txt
    Properties:
      Role: !GetAtt AqiFunctionExecutionRole.Arn
      Runtime: python3.14
      Architectures: [arm64]
      PackageType: Zip
      CodeUri: src/
      Handler: bluegull_aqi_service.lambda_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CACHE_TABLE_NAME: !Ref AqiCacheTable
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
          AIRNOW_API_KEY_SSM_PARAMETER: !Ref AirNowApiKeySsmParameter
      Events:
        AqiRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref AqiHttpApi
            Path: /aqi
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Default (execute-api) endpoint for the HTTP API -- superseded by the custom domain once bluegull-aqi-q9r.6 lands.
    Value: !Sub "https://${AqiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
