version = 0.1

# [default...] is for local/manual `sam deploy` (interactive changeset
# confirmation) -- mirrors [dev...] below. The three named config-envs
# (bluegull-aqi-q9r.8) are for the GitHub Actions deploy workflow, which
# passes --config-env and --no-confirm-changeset explicitly.
#
# DomainName/HostedZoneId (bluegull-aqi-q9r.6): single domain,
# bluegull.solutions (bluegull-aqi-8ef.24) -- one Route53 hosted zone
# (Z06150363PJ0MRTG6PK26) shared by all three dot-subdomain stacks.
#
# LambdaReservedConcurrentExecutions=0 on every environment (TEMPORARY):
# this account's Lambda concurrency quota is still only 10 -- AWS denied the
# increase request (support case, 2026-08-04) citing insufficient account
# history -- and AWS enforces a hard floor of 10 *unreserved* executions
# account-wide, so with only 10 total, no positive reservation is possible
# on ANY stack yet, prod included. 0 is template.yaml's sentinel for "skip
# the reservation" (see its own Description). Revert once the quota
# increase lands -- filed as bluegull-aqi-q9r.35 (dev), also applies to prod
# now that it exists.
#
# MissRateLimitBudget / AirNowRequestAlarmThreshold are split across dev and
# prod (2026-08-24) because both share the SAME AirNow API key (same SSM
# parameter path, AirNowApiKeySsmParameter's default) -- a deliberate choice
# over registering a second key, so they share AirNow's real confirmed
# 500/hour ceiling (doc/DESIGN.md "Rate limit -- confirmed 2026-08-24")
# rather than each independently self-throttling at the template default
# (400, meant for a single-stack world) and potentially summing past 500
# combined. Split 150 (dev) / 350 (prod), not even, since prod carries real
# test-user traffic (bluegull-aqi-fw4.6) while dev is Steve's own
# lower-volume experimentation -- both still generously above the actual
# observed peak (17/hour, 2026-08-24). Alarm thresholds stay 80% of each
# stack's own budget, same ratio as the template default.

[default.deploy.parameters]
stack_name = "bluegull-aqi-dev"
resolve_s3 = true
s3_prefix = "bluegull-aqi-dev"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
parameter_overrides = "DomainName=\"dev.aqi.bluegull.solutions\" HostedZoneId=\"Z06150363PJ0MRTG6PK26\" LambdaReservedConcurrentExecutions=0 MissRateLimitBudget=150 AirNowRequestAlarmThreshold=120"

[default.global.parameters]
region = "us-east-2"

[dev.deploy.parameters]
stack_name = "bluegull-aqi-dev"
resolve_s3 = true
s3_prefix = "bluegull-aqi-dev"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
parameter_overrides = "DomainName=\"dev.aqi.bluegull.solutions\" HostedZoneId=\"Z06150363PJ0MRTG6PK26\" LambdaReservedConcurrentExecutions=0 MissRateLimitBudget=150 AirNowRequestAlarmThreshold=120"

[dev.global.parameters]
region = "us-east-2"

[stage.deploy.parameters]
stack_name = "bluegull-aqi-stage"
resolve_s3 = true
s3_prefix = "bluegull-aqi-stage"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
parameter_overrides = "DomainName=\"stage.aqi.bluegull.solutions\" HostedZoneId=\"Z06150363PJ0MRTG6PK26\" LambdaReservedConcurrentExecutions=0"

[stage.global.parameters]
region = "us-east-2"

[prod.deploy.parameters]
stack_name = "bluegull-aqi-prod"
resolve_s3 = true
s3_prefix = "bluegull-aqi-prod"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
parameter_overrides = "DomainName=\"aqi.bluegull.solutions\" HostedZoneId=\"Z06150363PJ0MRTG6PK26\" LambdaReservedConcurrentExecutions=0 MissRateLimitBudget=350 AirNowRequestAlarmThreshold=280"

[prod.global.parameters]
region = "us-east-2"
