name: Secret scan

# Backstop for commits made without the local pre-commit hook installed --
# fresh clones, other machines, other agents. See doc/DESIGN.md "Secrets &
# credentials" / "Enforcement". The hook and this job share the same rules
# file (.betterleaks.toml), which includes a custom rule for the AirNow key:
# it has no distinctive prefix, so default pattern-scanner rules alone won't
# catch it.

on:
  push:
    branches: [main]
  pull_request:

env:
  BETTERLEAKS_VERSION: "1.7.2"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt"
          grep "betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          sudo mv betterleaks /usr/local/bin/betterleaks
          betterleaks --version

      - name: Scan full repo history
        run: betterleaks git . --config .betterleaks.toml --redact
